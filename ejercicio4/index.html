
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarifa de parqueadero</title>
    <script src="app.js" defer></script>
</head>
<body>
    <h1>Calculadora de parqueadero</h1>

    <form id="formulario">
        <label for="minutos">Tiempo estacionado (minutos):</label>
        <input type="number" id="minutos" min="1" step="1" required>

        <button type="submit">Calcular tarifa</button>
    </form>

    <p id="resultado" aria-live="polite"></p>
</body>
</html>
